services:
  nacos:
    # Nacos 3.x Server — 与项目 nacos-client 3.2.3 配套
    image: nacos/nacos-server:v3.2.3
    container_name: starpivot-nacos
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      # Nacos 3.x 强制要求以下三个 Auth 变量，缺失将导致启动失败
      NACOS_AUTH_TOKEN: c3RhcnBpdm90LW5hY29zLXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0zMi1jaGFycy1sb25n
      NACOS_AUTH_IDENTITY_KEY: starpivot-nacos-server
      NACOS_AUTH_IDENTITY_VALUE: starpivot-nacos-server
    ports:
      - "8848:8848"   # API / gRPC 端口
      - "9848:9848"   # gRPC 客户端端口
      - "18080:8080"  # Console UI（Nacos 3.x 独立端口，映射 18080 避免与网关等冲突）
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      starpivot-net:
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: starpivot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    # 不挂载 docker-entrypoint-initdb.d；建库与导入 SQL 见 README.md「快速开始 → 1. 启动基础设施」
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time_zone='+8:00'
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      starpivot-net:
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: starpivot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass root --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      starpivot-net:
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: starpivot-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      starpivot-net:
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: starpivot-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      starpivot-net:
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: starpivot-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      starpivot-net:
    restart: unless-stopped

# 声明全部命名卷（关键新增区块）
volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rabbitmq-data:
  es-data:

networks:
  starpivot-net:
    driver: bridge